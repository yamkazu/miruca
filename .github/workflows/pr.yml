# Every PR: CI -> AI review + security review -> quality gate -> auto-merge / fix request / human.
# Required status checks on main: "ci" and "quality-gate". See docs/ai-workflow.md.
name: PR

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

env:
  # Highest risk tier that may merge without a person: none | low | medium. Override with a repo variable.
  AUTO_MERGE_MAX_TIER: ${{ vars.AUTO_MERGE_MAX_TIER || 'low' }}
  HUMAN_REVIEWER: ${{ vars.HUMAN_REVIEWER || github.repository_owner }}
  AI_AUTHORS: claude[bot]

jobs:
  reset:
    # A new commit invalidates the previous verdict: approvals cover one commit.
    if: github.event.action == 'synchronize'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/gate
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/gate/run.mjs reset
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

  ci:
    runs-on: ubuntu-latest
    concurrency:
      group: ci-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run synth

  ai-review:
    needs: ci
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allowed_bots: claude[bot],claude,cursor[bot],cursor,chatgpt-codex-connector[bot]
          prompt: /code-review medium ${{ github.event.pull_request.number }} --comment
          claude_args: |
            --model ${{ vars.REVIEW_MODEL || 'claude-sonnet-5-5' }}
            --append-system-prompt "Post every finding as an inline PR comment. Start the comment with [critical] if it is a serious bug or security hole, otherwise with [minor]."
            --allowedTools "Skill,mcp__github_inline_comment__create_inline_comment,Bash(gh:*),Bash(git:*),Read,Glob,Grep,Task,Agent"

  security-review:
    needs: ci
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: security-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The security-review skill diffs against origin/HEAD, which actions/checkout does not set.
      - run: git remote set-head origin "$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}
      - id: review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allowed_bots: claude[bot],claude,cursor[bot],cursor,chatgpt-codex-connector[bot]
          prompt: /security-review
          claude_args: |
            --model ${{ vars.SECURITY_REVIEW_MODEL || 'claude-sonnet-5-5' }}
            --append-system-prompt "Post every finding as an inline PR comment. Start the comment with [critical] if its severity is HIGH, otherwise with [minor]."
            --allowedTools "Skill,mcp__github_inline_comment__create_inline_comment,Bash(gh:*),Bash(git:*),Read,Glob,Grep,LS,Task,Agent"

  quality-gate:
    needs: [reset, ci, ai-review, security-review]
    if: always() && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    concurrency:
      group: gate-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      action: ${{ steps.gate.outputs.action }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/gate
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: gate
        run: node scripts/gate/run.mjs decide
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CI_RESULT: ${{ needs.ci.result }}
          REVIEW_RESULT: ${{ needs.ai-review.result }}
          SECURITY_RESULT: ${{ needs.security-review.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  deploy-after-automerge:
    # GITHUB_TOKEN merges do not fire push events, so start the deploy once the auto-merge lands.
    needs: quality-gate
    if: needs.quality-gate.outputs.action == 'automerge'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - run: |
          for i in $(seq 1 60); do
            state=$(gh pr view "$PR" --json state -q .state)
            if [ "$state" = MERGED ]; then gh workflow run deploy.yml --ref main; exit 0; fi
            if [ "$state" = CLOSED ]; then exit 0; fi
            sleep 15
          done
          echo "PR #$PR was not merged within 15 minutes; skipping deploy" >> "$GITHUB_STEP_SUMMARY"
