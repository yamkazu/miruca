# Every PR: CI -> AI review + security review -> quality gate -> auto-merge / AI fix / human.
# Required status checks on main: "ci" and "quality-gate". See docs/ai-workflow.md.
name: PR

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

env:
  # Highest risk tier that may merge without a person: none | low | medium. Override with a repo variable.
  AUTO_MERGE_MAX_TIER: ${{ vars.AUTO_MERGE_MAX_TIER || 'low' }}
  HUMAN_REVIEWER: ${{ vars.HUMAN_REVIEWER || github.repository_owner }}
  AI_AUTHORS: claude[bot]

jobs:
  reset:
    # A new commit invalidates the previous verdict: approvals cover one commit.
    if: github.event.action == 'synchronize'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/gate
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/gate/run.mjs reset
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

  ci:
    runs-on: ubuntu-latest
    concurrency:
      group: ci-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run synth

  ai-review:
    needs: ci
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    outputs:
      result: ${{ steps.review.outputs.structured_output }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allowed_bots: claude[bot],claude
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are the code reviewer for this PR. You did not write it. Follow REVIEW.md and CLAUDE.md.
            Read the linked issue (`Closes #N` in the PR body) and check the change against its acceptance criteria.

            1. Hunt for bugs: start several subagents in parallel, each looking from a different angle
               (correctness against the acceptance criteria, edge cases and error handling, breaking API/UI behaviour, missing tests).
               On a bug fix, check it fixes the root cause.
            2. Verify: for every candidate finding, have a separate subagent try to disprove it with file:line evidence.
               Keep only findings that survive. Drop style, formatting and cleanup comments (Biome covers those).
            3. If you reviewed this PR before (see existing review comments), review only what changed since,
               and never repeat a finding you already posted.
            4. Post each surviving finding as an inline comment, prefixed with **Important**, **Nit** (at most 3) or
               **Pre-existing** (bug that was already there; not the author's fault).
            5. Classify the risk of the change:
               - low: docs, copy, tests only, additive changes that do not alter existing behaviour or APIs
               - medium: ordinary feature work and bug fixes in apps/
               - high: infra/, CI workflows, auth or tokens, data deletion, dependency changes
            6. Decide the verdict: pass (meets the acceptance criteria, no Important findings), fix (Important findings
               the author can fix), or human (needs a product or design decision, or the issue is ambiguous).

            Return the structured result. `summary` is one or two Japanese sentences that start with the finding count.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*),Read,Glob,Grep,Task"
            --json-schema '{"type":"object","properties":{"tier":{"type":"string","enum":["low","medium","high"]},"verdict":{"type":"string","enum":["pass","fix","human"]},"important":{"type":"integer","minimum":0},"summary":{"type":"string"}},"required":["tier","verdict","important","summary"]}'

  security-review:
    needs: ci
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: security-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    outputs:
      result: ${{ steps.review.outputs.structured_output }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allowed_bots: claude[bot],claude
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Do a security review of this PR's diff only (`gh pr diff`). Look for: leaked secrets or tokens,
            injection (command, SQL, XSS), missing authorization, over-broad IAM or CloudFront/S3 exposure,
            unsafe handling of GitHub tokens, and new dependencies with known risk.
            Verify every candidate with file:line evidence and drop anything you cannot show is exploitable.
            Post each confirmed finding as an inline comment prefixed with **Security**.
            Do not repeat findings you already posted on this PR.
            Return the structured result. `summary` is one Japanese sentence that starts with the finding count.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep,Task"
            --json-schema '{"type":"object","properties":{"findings":{"type":"integer","minimum":0},"summary":{"type":"string"}},"required":["findings","summary"]}'

  quality-gate:
    needs: [reset, ci, ai-review, security-review]
    if: always() && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    concurrency:
      group: gate-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      action: ${{ steps.gate.outputs.action }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/gate
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: gate
        run: node scripts/gate/run.mjs decide
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CI_RESULT: ${{ needs.ci.result }}
          REVIEW_JSON: ${{ needs.ai-review.outputs.result }}
          SECURITY_JSON: ${{ needs.security-review.outputs.result }}

  auto-fix:
    # The gate asked for a fix: the implementing Claude addresses the findings and pushes,
    # which starts this workflow again. The gate caps this at 3 rounds.
    needs: quality-gate
    if: always() && needs.quality-gate.outputs.action == 'fix'
    runs-on: ubuntu-latest
    concurrency:
      group: fix-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allowed_bots: claude[bot],claude
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BRANCH: ${{ github.event.pull_request.head.ref }}

            The quality gate sent this PR back. Read the latest "品質ゲートからの修正依頼" comment and the unresolved
            **Important** and **Security** review comments (`gh pr view --comments`).
            Fix each one, fixing the whole bug class rather than only the flagged line. If a finding is wrong,
            leave the code as is and say why in one PR comment (`gh pr comment`). Follow CLAUDE.md.
            Then run `npm run lint`, `npm run typecheck`, `npm test` and `npm run synth` until all pass,
            commit with a message that lists what you fixed, and `git push origin HEAD:${{ github.event.pull_request.head.ref }}`.
          claude_args: |
            --allowedTools "Edit,Write,Read,Glob,Grep,Task,Bash(npm ci),Bash(npm run:*),Bash(npm test:*),Bash(npx biome:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"
