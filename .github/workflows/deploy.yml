# Deploys to AWS with CDK whenever main changes. Authenticates with GitHub OIDC (no AWS keys stored).
# Skipped until the repo variable AWS_DEPLOY_ROLE_ARN is set. Setup: docs/ai-workflow.md "CI からのデプロイ".
name: Deploy

on:
  push:
    branches: [main]
  # Auto-merges are made with GITHUB_TOKEN, which does not fire push events,
  # so pr.yml dispatches this workflow after an auto-merge lands.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      CDK_DEFAULT_REGION: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
      # Idempotent: the first run creates the CDK bootstrap stack, later runs leave it as is.
      - run: npm run cdk -w @miruca/infra -- bootstrap
      - run: npm run deploy -- --require-approval never --outputs-file cdk-outputs.json
      - name: Summary
        run: |
          echo "### デプロイ完了: $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"
          node -e 'const o=require("./infra/cdk-outputs.json").Miruca||{};for(const[k,v]of Object.entries(o))console.log(`- ${k}: ${v}`)' >> "$GITHUB_STEP_SUMMARY" || true
