# Claude implements issues and answers @claude.
#   - Label an issue `ai:ready`: Claude implements it, verifies it and opens a PR.
#   - Comment `@claude ...` on an issue or PR (repo writers only): Claude resumes, answers or fixes.
name: Claude

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  claude:
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'ai:ready') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Mark the issue as in progress
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh label create ai:working --color fbca04 --description "AI が実装中" 2>/dev/null || true
          gh label create ai:question --color c5def5 --description "AI が質問中。答えて @claude で再開" 2>/dev/null || true
          gh issue edit "$ISSUE" --add-label ai:working --remove-label ai:ready --remove-label ai:question

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          label_trigger: ai:ready
          branch_prefix: ai/
          track_progress: ${{ github.event_name == 'issues' }}
          additional_permissions: |
            actions: read
          claude_args: |
            --allowedTools "Edit,Write,Read,Glob,Grep,Task,TodoWrite,Bash(npm ci),Bash(npm install:*),Bash(npm run:*),Bash(npm test:*),Bash(npx biome:*),Bash(npx vitest:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(gh issue view:*),Bash(gh issue edit:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr diff:*)"
            --append-system-prompt "Follow the 'AI の作業手順' section of CLAUDE.md. When working from an issue, finish by opening the PR yourself with gh pr create (base main, body from .github/pull_request_template.md, including 'Closes #<issue>'). If the issue is too ambiguous to implement, do not write code: ask your questions in your comment and run gh issue edit <issue> --add-label ai:question."

      - name: Clear the in-progress label
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: gh issue edit "$ISSUE" --remove-label ai:working || true
