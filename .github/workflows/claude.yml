# Claude in GitHub Actions: comment `@claude ...` on an issue or PR (repo writers only) and Claude answers or fixes.
# Implementing a `ready-for-agent` issue is not done here: the Claude project's routine picks the label up and
# implements it in a project thread (`claude/` branch). Every PR goes through the pr.yml gate; see docs/ai-workflow.md.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  respond:
    if: >-
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          branch_prefix: ai/
          plugin_marketplaces: https://github.com/cursor/plugins.git
          plugins: pstack@cursor-plugins
          additional_permissions: |
            actions: read
          claude_args: |
            --allowedTools "Edit,Write,Read,Glob,Grep,Agent,Task,Skill,TodoWrite,Bash"
            --append-system-prompt "Work in the style of the pstack poteto-mode skill: read its SKILL.md (find ~/.claude/plugins -path '*pstack*/skills/poteto-mode/SKILL.md') and the Claude Code adapter it names, and follow them. Follow CLAUDE.md. Before pushing, run npm run lint, npm run typecheck, npm test and npm run synth until they pass. On an issue that is now clear enough to build, implement it on an ai/ branch and open the PR with gh pr create (base main, .github/pull_request_template.md, Closes #<issue>). Never merge a PR."
